name: Android APK

# Se ejecuta al subir una etiqueta de versión (v0.1.0, v0.2.0…) o a mano desde la pestaña Actions.
# Compila la app Android (Capacitor), la firma y la publica en GitHub Releases como appetito.apk.
# La última versión siempre está en:
#   https://github.com/charlievaibs/appetito/releases/latest/download/appetito.apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (por ejemplo 0.1.0)"
        required: true
      publish:
        description: "¿Publicar en Releases? Si no, el APK queda solo como archivo de la ejecución"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Entorno «release»: aquí viven los secretos de firma y se puede exigir tu aprobación.
    environment: release
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      # Copia la configuración de Capacitor al proyecto Android (no se versiona).
      - name: Sincronizar Capacitor
        run: npx cap sync android

      # Con la clave propia en los secretos del repositorio, las actualizaciones se instalan
      # encima de la versión anterior. Sin ella el APK se firma con una clave de depuración
      # temporal (instalable, pero cada versión nueva obliga a desinstalar la anterior).
      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin clave de firma propia: se usa la de depuración."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/appetito.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/appetito.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Compilar el APK
        working-directory: android
        run: |
          NAME="${VERSION#v}"
          export APP_VERSION_NAME="$NAME"
          export APP_VERSION_CODE="${{ github.run_number }}"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Huella para fijarla en src/lib/release.ts: es lo que la web exigirá al descargar.
      - name: Calcular huellas
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          {
            echo "### Huellas de appetito.apk $VERSION"
            echo
            echo "SHA-256 del archivo (va en src/lib/release.ts):"
            echo '```'
            sha256sum "$APK" | cut -d' ' -f1
            echo '```'
            echo "Certificado de firma:"
            echo '```'
            "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep "SHA-256" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar el APK como archivo de la ejecución
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appetito-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Las etiquetas v* siempre publican; las ejecuciones manuales solo si se marca «publish».
      - name: Publicar en Releases
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          cp android/app/build/outputs/apk/release/app-release.apk appetito.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" appetito.apk --clobber
          else
            gh release create "$TAG" appetito.apk --title "Appetito $TAG" \
              --notes "App Android de Appetito. Descarga appetito.apk, ábrelo en tu móvil y permite instalar desde esta fuente cuando Android lo pida."
          fi
